<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>خدمة خامسة وسادسة</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f2f3f5;
      --surface: #ffffff;
      --ink: #1b2233;
      --muted: #5f6878;
      --line: #dde0e6;
      --accent: #0f6b63;
      --accent-ink: #ffffff;
      --danger: #b3261e;
      --ok: #1a7f4b;
      --gold: #b8860b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12151c;
        --surface: #1b1f29;
        --ink: #eceef3;
        --muted: #9aa2b1;
        --line: #2c3240;
        --accent: #4fc3b5;
        --accent-ink: #0c1512;
        --danger: #f2837c;
        --ok: #4cc38a;
        --gold: #e0b341;
      }
    }

    :root[data-theme="dark"] {
      --bg: #12151c;
      --surface: #1b1f29;
      --ink: #eceef3;
      --muted: #9aa2b1;
      --line: #2c3240;
      --accent: #4fc3b5;
      --accent-ink: #0c1512;
      --danger: #f2837c;
      --ok: #4cc38a;
      --gold: #e0b341;
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 8px 0 2px;
    }

    h2 {
      font-size: 1.05rem;
      margin: 0 0 10px;
    }

    .sub {
      color: var(--muted);
      margin: 0 0 6px;
    }

    .status {
      font-size: .88rem;
      margin: 0 0 14px;
      color: var(--muted);
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .tile {
      --c: var(--muted);
      font: inherit;
      color: inherit;
      text-align: right;
      cursor: pointer;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .tile .band {
      height: 10px;
      background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 55%, white), var(--c));
    }

    .tile .body {
      padding: 8px 12px 10px;
    }

    .tile .count {
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .tile .name {
      font-weight: 600;
    }

    .tile[aria-pressed="true"] {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      align-items: center;
    }

    input[type=text],
    input[type=search],
    input[type=tel],
    input[type=password],
    input[type=date],
    select,
    textarea {
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 12px;
      min-width: 0;
    }

    input[type=search] {
      flex: 1 1 200px;
    }

    input[type=password] {
      flex: 1 1 160px;
      direction: ltr;
    }

    input[type=tel] {
      direction: ltr;
      text-align: right;
    }

    button.btn,
    a.btn {
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      text-decoration: none;
      display: inline-block;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 14px;
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    button.danger {
      color: var(--danger);
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .addgrid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .addgrid .full {
      grid-column: 1 / -1;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      border-inline-start: 6px solid var(--line);
    }

    .row.late {
      border-inline-start-color: var(--danger);
    }

    .row.ok {
      border-inline-start-color: var(--ok);
    }

    .row.todo {
      border-inline-start-color: var(--gold);
    }

    .todo-text {
      color: var(--gold);
      font-weight: 600;
    }

    .row .who {
      min-width: 0;
      flex: 1 1 180px;
    }

    .row .who strong {
      display: block;
      overflow-wrap: anywhere;
    }

    .row .who span {
      display: block;
      font-size: .88rem;
    }

    .late-text {
      color: var(--danger);
      font-weight: 600;
    }

    .ok-text {
      color: var(--ok);
      font-weight: 600;
    }

    .chip {
      font-size: .8rem;
      padding: 2px 9px;
      border-radius: 99px;
      border: 1px solid var(--line);
      color: var(--muted);
      white-space: nowrap;
    }

    .chip.bday {
      border-color: var(--gold);
      color: var(--gold);
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 12px;
      border: 1px dashed var(--line);
      border-radius: 12px;
    }

    .muted {
      color: var(--muted);
      font-size: .9rem;
    }

    .banner {
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1.5px solid var(--line);
      background: var(--surface);
    }

    .banner.bday {
      border-color: var(--gold);
      background: color-mix(in srgb, var(--gold) 12%, var(--surface));
    }

    .banner.late {
      border-color: var(--danger);
      background: color-mix(in srgb, var(--danger) 9%, var(--surface));
    }

    .banner .bar {
      margin: 6px 0 0;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px calc(env(safe-area-inset-bottom, 0px) + 16px);
      overflow: auto;
      z-index: 20;
    }

    .sheet {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      width: 100%;
      max-width: 580px;
      padding: 16px;
    }

    .sheet .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .sheet .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0;
    }

    .sheet .fields .full {
      grid-column: 1 / -1;
    }

    .sheet label.f {
      display: flex;
      flex-direction: column;
      font-size: .82rem;
      color: var(--muted);
      gap: 2px;
    }

    .hist {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 240px;
      overflow: auto;
      margin-top: 6px;
    }

    .hist .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding: 4px 0;
      font-size: .92rem;
    }

    .hist .item button {
      padding: 2px 8px;
    }

    #scanVid {
      width: 100%;
      border-radius: 12px;
      background: #000;
      max-height: 60vh;
    }

    .qrimg {
      display: block;
      margin: 10px auto;
      width: 240px;
      max-width: 100%;
      background: #fff;
      padding: 8px;
      border-radius: 8px;
    }

    .av {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
      background: var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .av.big {
      width: 84px;
      height: 84px;
      font-size: 2.4rem;
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 6;
      background: var(--bg);
      padding: 6px 0 8px;
      margin-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .tab {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 8px 14px;
      flex: none;
    }

    .tab.on {
      background: var(--accent);
      color: var(--accent-ink);
      border-color: var(--accent);
    }

    details.panel>summary {
      cursor: pointer;
      font-weight: 700;
      list-style-position: inside;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="head">
      <div>
        <h1>خدمة خامسة وسادسة</h1>
        <p class="sub" id="roleLine">دخول الخدام</p>
      </div>
      <button class="btn" id="whoBtn" type="button" hidden></button>
      <button class="btn" id="logoutBtn" type="button" hidden>خروج</button>
    </div>
    <p class="status" id="status" role="status"></p>

    <!-- ===== تسجيل الدخول ===== -->
    <section class="panel" id="loginPanel">
      <h2>دخول الخدام</h2>
      <div class="bar">
        <input type="password" id="pass" placeholder="الباسورد" autocomplete="current-password">
        <button class="btn" id="showPass" type="button" aria-label="إظهار الباسورد" title="إظهار الباسورد">👁</button>
        <button class="btn primary" id="loginBtn" type="button">دخول</button>
      </div>
      <div class="muted" id="loginMsg" role="status"></div>
    </section>

    <!-- ===== التطبيق ===== -->
    <div id="app" hidden>
      <nav class="tabs" id="tabs" aria-label="الأقسام">
        <button class="tab on" type="button" data-tab="visit">👥 الافتقاد</button>
        <button class="tab" type="button" data-tab="att">🗓️ الحضور</button>
        <button class="tab" type="button" data-tab="ik" id="tabIk" hidden>🤝 إخوة الرب</button>
        <button class="tab" type="button" data-tab="backup">📥 نسخة احتياطية</button>
      </nav>

      <section id="tab-visit">
        <div id="alerts"></div>
        <div class="tiles" id="tiles" role="group" aria-label="فلتر"></div>

        <details class="panel" id="addBox">
          <summary>➕ إضافة مخدوم</summary>
          <div class="addgrid" style="margin-top:10px">
            <input type="text" id="newName" class="full" placeholder="الاسم" autocomplete="off">
            <select id="newGender" aria-label="ولد ولا بنت">
              <option value="boys">ولد</option>
              <option value="girls">بنت</option>
            </select>
            <select id="newGrade" aria-label="السنة">
              <option value="5">سنة خامسة</option>
              <option value="6">سنة سادسة</option>
            </select>
            <input type="tel" id="newPhone" placeholder="رقم التليفون" autocomplete="off">
            <input type="tel" id="newPhone2" placeholder="رقم احتياطي" autocomplete="off">
            <input type="text" id="newFather" placeholder="أب الاعتراف" autocomplete="off">
            <input type="text" id="newAddress" class="full" placeholder="العنوان" autocomplete="off">
            <input type="date" id="newBday" aria-label="تاريخ الميلاد" title="تاريخ الميلاد">
            <button class="btn primary" id="addBtn" type="button">إضافة</button>
          </div>
        </details>

        <div class="bar">
          <input type="search" id="q" placeholder="ابحث بالاسم أو الرقم أو أب الاعتراف أو العنوان" aria-label="بحث">
          <select id="stSel" aria-label="فلتر الافتقاد">
            <option value="all">كل المخدومين</option>
            <option value="todo">محتاجين افتقاد دلوقتي</option>
            <option value="late">المتأخرين (4 أيام أو أكتر)</option>
          </select>
        </div>
        <div class="muted" id="resultInfo" style="margin-bottom:8px"></div>
        <div class="list" id="list"></div>
      </section>

      <section id="tab-att" hidden></section>
      <section id="tab-ik" hidden></section>

      <section id="tab-backup" hidden>
        <section class="panel" id="backupRow" style="margin-top:20px" hidden>
          <h2>📥 نسخة احتياطية</h2>
          <p class="muted">بتنزّل ملف <b>Excel</b> عادي تفتحه وتقراه: ورقة بكل المخدومين (الاسم والسنة والأرقام وأب
            الاعتراف والعنوان وعيد الميلاد وآخر افتقاد) وورقة بسجل الافتقاد كله. احفظه في مكان آمن لأن فيه بيانات
            الأطفال.
          </p>
          <div class="bar">
            <button class="btn primary" id="exportBtn" type="button">تحميل ملف Excel</button>
            <button class="btn" id="exportCsvBtn" type="button">تحميل CSV (لو الـ Excel ما اشتغلش)</button>
          </div>
          <div class="muted" id="backupScope" style="margin-bottom:6px"></div>
          <div class="muted" id="backupMsg" role="status"></div>
        </section>
      </section>
    </div>
  </main>

  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="sheet" id="sheet"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

      /* ===== helpers-pure-start ===== */

      function daysBetween(a, b) {
        return Math.round((new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z")) / 86400000);
      }

      function weekStartOf(t) {
        var d = new Date(t + "T00:00:00Z");
        d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() - WEEK_START_DAY + 7) % 7));

      function addDays(iso, n) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return isoUTC(d); }
      /* الافتقاد: بعد ما يتسجل المخدوم بيبقى "تمام" لحد ميعاد الافتقاد الجاي، وبعدها بيبقى "محتاج افتقاد".
         ميعاد الجاي = آخر افتقاد + CYCLE_DAYS (rolling) أو أول الأسبوع اللي بعده (week).

      function statusOf(k, today) {
        var last = "", types = [];
        (k.visits || []).forEach(function (v) { if (v.d > last) last = v.d; });

        var base = last || k.added || today;
        var days = Math.max(0, daysBetween(base, today));
        var due = last ? (CYCLE_MODE === "week" ? addDays(weekStartOf(last), 7) : addDays(last, CYCLE_DAYS)) : base;
        var done = !!last && today < due;
        var overdue = done ? 0 : Math.max(0, daysBetween(due, today));
        return { last: last, lastTypes: types, never: !last, days: days, due: due, done: done, weekDone: done, dueIn: done ? daysBetween(today, due) : 0, overdue: overdue, late: !done && overdue >= ALERT_DAYS, todayDone: last === today, todayTypes: last === today ? types : [] };
      }
      function isBdayToday(k, today) {
        return !!k.birthday && k.birthday.slice(5) === today.slice(5);

      function daysToBirthday(k, today) {
        if (!k.birthday) return 999;

        if (p.length !== 3) return 999;
        var t0 = new Date(today + "T00:00:00Z"), y = t0.getUTCFullYear();
        var n = new Date(Date.UTC(y, +p[1] - 1, +p[2]));
        if (n < t0) n = new Date(Date.UTC(y + 1, +p[1] - 1, +p[2]));
        return Math.round((n - t0) / 86400000);
      }
      function waLink(num, text) {
        var d = String(num || "").replace(/\D/g, "");

        if (d.charAt(0) === "0") d = "20" + d.slice(1);
        return "https://wa.me/" + d + (text ? "?text=" + encodeURIComponent(text) : "");
      }
      /* ===== helpers-pure-end ===== */

      var state = { role: "", kidsBy: { boys: [], girls: [] }, vlog: {} };
      var gFilter = "all", grFilter = "all", stFilter = "all", query = "";
      var armed = {}, chain = {};
      var dbRef = null, auth = null, unsubs = [];
      var openId = null;

      function $(id) { return document.getElementById(id); }
      var uidN = 0;
      function uid() { return Date.now().toString(36) + (uidN++).toString(36) + Math.random().toString(36).slice(2, 5); }
      function norm(s) {
        return String(s || "").toLowerCase().trim()
          .replace(/[\u064B-\u0652\u0640]/g, "")
          .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
      }
      function h(tag, attrs) {

      $("attDate").addEventListener("change", function (e) { sel = e.target.value; renderAtt(); });
      $("attQ").addEventListener("input", function (e) { q = e.target.value; renderAtt(); });
      $("attFilter").addEventListener("change", renderAtt);
      $("attG").addEventListener("change", renderAtt);

      function has(k, d) { return !!k.att && k.att.indexOf(d) > -1; }
      function mark(k, d, on) {
        if (!k.att) k.att = [];
        var i = k.att.indexOf(d);
        if (on && i < 0) k.att.push(d);
        if (!on && i > -1) k.att.splice(i, 1);
        A.db().collection("attendance").doc(k.id).set({ att: firebase.firestore.FieldValue[on ? "arrayUnion" : "arrayRemove"](d) }, { merge: true })
          .catch(function () { A.flash("مقدرتش أحفظ الحضور. جرّب تاني."); });
        renderAtt();
      }
      function renderAtt() {
        var kids = kidsList(), box = $("attList"), nq = A.norm(q), f = $("attFilter").value, g = $("attG").value;
        box.textContent = "";
        var shown = kids.filter(function (k) { return g === "all" || k.gender === g; });
        $("attCount").textContent = "حضر " + shown.filter(function (k) { return has(k, sel); }).length + " من " + shown.length;
        shown.filter(function (k) {
          var on = has(k, sel);
          if (f === "in" && !on) return false;
          if (f === "out" && on) return false;
          return !nq || A.norm(k.name).indexOf(nq) > -1;
        }).sort(function (a, b) { return a.name.localeCompare(b.name, "ar"); }).forEach(function (k) {
          var on = has(k, sel);
          var row = h("div", { class: "row " + (on ? "ok" : "") }, A.avatar(k),
            h("div", { class: "who" }, h("strong", { text: (k.gender === "boys" ? "👦 " : "👧 ") + k.name }), h("span", { class: "muted", text: "سنة " + A.gradeLabel(k.grade) })));
          var b = h("button", { class: "btn" + (on ? " primary" : ""), type: "button", text: on ? "✓ حضر" : "تسجيل حضور" });
          b.addEventListener("click", function () { mark(k, sel, !on); });
          row.appendChild(b);
          row.appendChild(h("button", { class: "btn", type: "button", text: "QR", onclick: function () { showQr(k); } }));
          box.appendChild(row);
        });
      }
      /* بيحدّث سجل الحضور بأسماء مخدومين الخادم ده (الاسم والسنة بس) */
      function syncRoster() {
        if (!rosterReady) return;
        A.allKids().forEach(function (k) {
          var r = roster[k.id], miss = (k.att || []).filter(function (d) { return !r || r.att.indexOf(d) < 0; });
          if (r && r.name === k.name && r.grade === k.grade && r.gender === k.gender && !miss.length) return;
          var sig = k.name + "|" + k.grade + "|" + k.gender + "|" + miss.join(",");
          if (pending[k.id] === sig) return;
          pending[k.id] = sig;
          var data = { name: k.name, gender: k.gender, grade: k.grade };
          if (miss.length) data.att = firebase.firestore.FieldValue.arrayUnion.apply(null, miss);
          A.db().collection("attendance").doc(k.id).set(data, { merge: true }).catch(function () { delete pending[k.id]; });
        });
      }
      function startRoster() {
        rosterUnsub = A.db().collection("attendance").onSnapshot(function (s) {
          roster = {};
          s.docs.forEach(function (d) {
            var v = d.data() || {}, gd = v.gender === "girls" ? "girls" : "boys";
            roster[d.id] = {
              id: d.id, coll: gd, gender: gd, name: String(v.name || ""), grade: v.grade === 6 ? 6 : 5, photo: "",
              att: Array.isArray(v.att) ? v.att.filter(function (x) { return typeof x === "string"; }) : []
            };
          });
          rosterReady = true; syncRoster(); renderAtt();
        }, function () { $("attCount").textContent = "مش قادر أقرأ الحضور. لازم تضيف الـ Rule بتاعة attendance في Firebase."; });
      }
      window.AFT_kidDeleted = function (k) {
        A.db().collection("attendance").doc(k.id).delete().catch(function () { });
        delete roster[k.id]; renderAtt();
      };

      /* ===== QR ===== */
      function qrUrl(k) {
        if (!window.QRCode) return "";
        var d = document.createElement("div");
        new QRCode(d, { text: "AFT|" + k.coll + "|" + k.id, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
        var c = d.querySelector("canvas"); return c ? c.toDataURL("image/png") : "";
      }
      var qrBox = h("div", { class: "modal", hidden: "" }, h("div", { class: "sheet", id: "qrSheet" }));
      document.body.appendChild(qrBox);
      qrBox.addEventListener("click", function (e) { if (e.target === qrBox) qrBox.hidden = true; });
      function showQr(k) {
        var s = $("qrSheet"), u = qrUrl(k); s.textContent = "";
        if (!u) { s.appendChild(h("p", { text: "مكتبة الـ QR ما اتحمّلتش. اتأكد من النت." })); }
        else {
          s.appendChild(h("h2", { text: k.name }));
          s.appendChild(h("img", { class: "qrimg", src: u, alt: "QR " + k.name }));
          s.appendChild(h("div", { class: "muted", style: "text-align:center", text: "الكود فيه رقم تعريف بس، من غير أي بيانات شخصية." }));
          var bar = h("div", { class: "bar", style: "justify-content:center" });
          bar.appendChild(h("a", { class: "btn primary", href: u, download: "qr-" + k.name + ".png", text: "تحميل الصورة" }));
          s.appendChild(bar);
        }
        s.appendChild(h("div", { class: "bar", style: "justify-content:center" }, h("button", { class: "btn", type: "button", text: "إغلاق", onclick: function () { qrBox.hidden = true; } })));
        qrBox.hidden = false;
      }
      $("attPrint").addEventListener("click", function () {
        var kids = kidsList().sort(function (a, b) { return a.name.localeCompare(b.name, "ar"); });
        if (!kids.length || !window.QRCode) { A.flash("مفيش مخدومين أو مكتبة الـ QR مش محمّلة."); return; }
        var w = window.open("", "_blank"); if (!w) return;
        var doc = w.document;
        doc.write('<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>أكواد الحضور</title><style>body{font-family:Tahoma,Arial}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.c{border:1px solid #999;padding:8px;text-align:center;break-inside:avoid}.c img{width:100%;max-width:170px}</style><div class="g" id="g"></div></html>');
        doc.close();
        var g = doc.getElementById("g");
        kids.forEach(function (k) {
          var c = doc.createElement("div"); c.className = "c";
          var im = doc.createElement("img"); im.src = qrUrl(k);
          var n = doc.createElement("div"); n.textContent = k.name;
          c.appendChild(im); c.appendChild(n); g.appendChild(c);
        });
        setTimeout(function () { w.print(); }, 500);
      });

      /* ===== مسح الكود ===== */
      var stream = null, timer = 0, last = "", lastT = 0;
      var scanFile = h("input", { type: "file", accept: "image/*", hidden: "" });
      scanFile.setAttribute("capture", "environment");
      var scan = h("div", { class: "modal", hidden: "" }, h("div", { class: "sheet" },
        h("h2", { text: "مسح كود الحضور" }),
        h("div", { class: "muted", id: "scanDate" }),
        h("video", { id: "scanVid", playsinline: "", muted: "", autoplay: "" }),
        h("canvas", { id: "scanCan", hidden: "" }),
        h("div", { class: "banner", id: "scanMsg", style: "margin-top:10px", text: "..." }),
        h("div", { class: "bar" },
          h("button", { class: "btn primary", type: "button", text: "📸 صوّر الكود", onclick: function () { scanFile.click(); } }),
          h("button", { class: "btn", type: "button", text: "إنهاء", onclick: stopScan })),
        scanFile));
      document.body.appendChild(scan);
      function smsg(t) { $("scanMsg").textContent = t; }
      function loadLib(cb) {
        if (window.jsQR) { cb(true); return; }
        var sc = document.createElement("script");
        sc.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
        sc.onload = function () { cb(!!window.jsQR); };
        sc.onerror = function () { cb(false); };
        document.head.appendChild(sc);
      }
      $("attScan").addEventListener("click", function () {
        stopStream();
        $("scanDate").textContent = "التسجيل على: " + fmt(sel) + (sel !== A.todayStr() ? " (⚠️ مش تاريخ النهارده)" : "");
        scan.hidden = false; smsg("بيجهّز الكاميرا...");
        loadLib(function (ok) {
          if (!ok) { smsg("❌ مكتبة قراءة الـ QR ما اتحمّلتش. اتأكد من النت وجرّب تاني."); return; }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            smsg("المتصفح ده مش بيفتح الكاميرا مباشرة (لازم الموقع على https، وافتحه من Chrome أو Safari مش من جوه واتساب أو فيسبوك). استخدم زرار «📸 صوّر الكود».");
            return;
          }
          navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false }).then(function (s) {
            if (scan.hidden) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
            stream = s;
            var v = $("scanVid"); v.muted = true; v.srcObject = s;
            var pr = v.play(); if (pr && pr.catch) pr.catch(function () { });
            smsg("وجّه الكاميرا على الكود."); tick();
          }).catch(function (e) {
            smsg("الكاميرا مش شغالة (" + ((e && e.name) || "") + "). اسمح للموقع بالكاميرا من إعدادات المتصفح، أو استخدم زرار «📸 صوّر الكود».");
          });
        });
      });
      function stopStream() { clearTimeout(timer); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
      function stopScan() { stopStream(); scan.hidden = true; }
      function tick() {
        if (scan.hidden || !stream) return;
        var v = $("scanVid"), c = $("scanCan");
        if (v.readyState === v.HAVE_ENOUGH_DATA && v.videoWidth) {
          c.width = v.videoWidth; c.height = v.videoHeight;
          var x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(v, 0, 0);
          var im = x.getImageData(0, 0, c.width, c.height), r = jsQR(im.data, im.width, im.height);
          if (r && r.data) onCode(r.data);
        }
        timer = setTimeout(tick, 200);
      }
      scanFile.addEventListener("change", function () {
        var f = scanFile.files && scanFile.files[0]; scanFile.value = "";
        if (!f) return;
        loadLib(function (ok) {
          if (!ok) { smsg("❌ مكتبة قراءة الـ QR ما اتحمّلتش. اتأكد من النت."); return; }
          var img = new Image(), url = URL.createObjectURL(f);
          img.onload = function () {
            var c = $("scanCan"), r = Math.min(1, 1000 / Math.max(img.width, img.height));
            c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
            var x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            var im = x.getImageData(0, 0, c.width, c.height), res = jsQR(im.data, im.width, im.height);
            if (res && res.data) { last = ""; onCode(res.data); } else smsg("مقدرتش أقرا الكود من الصورة. قرّب وصوّر تاني.");
          };
          img.src = url;
        });
      });
      function onCode(d) {
        var now = Date.now(); if (d === last && now - lastT < 3000) return; last = d; lastT = now;
        var p = d.split("|"), k = p[0] === "AFT" ? roster[p[2]] : null;
        if (!k || !k.name) { smsg("❌ كود مش معروف"); return; }
        if (has(k, sel)) smsg("ℹ️ " + k.name + " حضوره متسجل قبل كده");
        else { mark(k, sel, true); smsg("✅ " + k.name + " حضر"); if (navigator.vibrate) navigator.vibrate(120); }
      }

      /* ===== إخوة الرب (الأدمن بس) ===== */
      var ik = h("section", { class: "panel", id: "ikPanel", hidden: "" });
      ik.innerHTML = '<h2>إخوة الرب (للأدمن فقط)</h2>' +
        '<div class="addgrid"><input type="text" id="ikName" class="full" placeholder="الاسم" autocomplete="off">' +
        '<select id="ikType" aria-label="شاب ولا شابة"><option value="شاب">شاب</option><option value="شابة">شابة</option></select>' +
        '<input type="tel" id="ikPhone" placeholder="رقم التليفون" autocomplete="off">' +
        '<input type="text" id="ikNote" class="full" placeholder="ملاحظة (اختياري)" autocomplete="off">' +
        '<button class="btn primary" id="ikAdd" type="button">إضافة</button></div>' +
        '<div class="muted" id="ikCount" style="margin:10px 0 6px"></div><div class="list" id="ikList"></div>';
      $("tab-ik").appendChild(ik);
      var ikData = [], unsub = null;
      $("ikAdd").addEventListener("click", function () {
        var n = $("ikName").value.trim(); if (!n) { $("ikName").focus(); return; }
        A.db().collection("ikhwa").add({ name: n, type: $("ikType").value, phone: $("ikPhone").value.trim(), note: $("ikNote").value.trim(), added: A.todayStr() })
          .catch(function () { A.flash("مقدرتش أضيف. راجع الـ Rules بتاعة ikhwa."); });
        ["ikName", "ikPhone", "ikNote"].forEach(function (id) { $(id).value = ""; });
      });
      function renderIk() {
        var box = $("ikList"); box.textContent = "";
        $("ikCount").textContent = "العدد: " + ikData.length;
        ikData.sort(function (a, b) { return a.name.localeCompare(b.name, "ar"); }).forEach(function (x) {
          var row = h("div", { class: "row" }, h("div", { class: "who" },
            h("strong", { text: (x.type === "شابة" ? "👩 " : "🧑 ") + x.name }),
            h("span", { class: "muted", text: x.type + (x.note ? " — " + x.note : "") })));
          if (x.phone) row.appendChild(h("a", { class: "btn", href: "tel:" + x.phone, text: "☎ اطلبه" }));
          row.appendChild(h("button", {
            class: "btn danger", type: "button", text: "حذف", onclick: function () {
              if (confirm("حذف " + x.name + "؟")) A.db().collection("ikhwa").doc(x.id).delete();
            }
          }));
          box.appendChild(row);
        });
      }

      window.AFT_render = function () {
        var role = A.state.role, admin = role === "all";
        if (role && !rosterUnsub) startRoster();
        if (!role && rosterUnsub) { rosterUnsub(); rosterUnsub = null; roster = {}; rosterReady = false; pending = {}; }
        ik.hidden = !admin;
        if (admin && !unsub) {
          unsub = A.db().collection("ikhwa").onSnapshot(function (s) {
            ikData = s.docs.map(function (d) { var v = d.data() || {}; return { id: d.id, name: String(v.name || ""), type: v.type === "شابة" ? "شابة" : "شاب", phone: String(v.phone || ""), note: String(v.note || "") }; });
            renderIk();
          }, function () { A.flash("مش قادر أقرأ إخوة الرب. أضف الـ Rule بتاعتها."); });
        }
        if (!admin && unsub) { unsub(); unsub = null; ikData = []; }
        if (role) { syncRoster(); renderAtt(); }
      };
    })();
  </script>

  <!-- ===== نسب الحضور (زرار 📊 جوه لوحة حضور الجمعة) ===== -->
  <script>
    (function () {
      var A = window.AFT; if (!A) return;
      var h = A.h;
      var FIRST = "2026-10-09"; /* أول جمعة (لازم تطابق START في السكريبت اللي فوق) */
      function $(i) { return document.getElementById(i); }

      /* ===== pure-start ===== */
      function isFriday(d) { var t = new Date(d + "T00:00:00Z"); return !isNaN(t.getTime()) && t.getUTCDay() === 5; }
      function computePercents(docs, today, addedById, first) {
        var heldSet = {};
        docs.forEach(function (k) {
          k.att.forEach(function (d) { if (d >= first && d <= today && isFriday(d)) heldSet[d] = true; });
        });
        var held = Object.keys(heldSet).sort();
        var rows = docs.filter(function (k) { return k.name; }).map(function (k) {
          var mine = k.att.filter(function (d, i, a) { return heldSet[d] && a.indexOf(d) === i; }).sort();
          var startFrom = held[0] || "";
          var added = addedById[k.id] || "";
          if (added) { startFrom = added; if (mine[0] && mine[0] < startFrom) startFrom = mine[0]; }
          var possible = held.filter(function (d) { return d >= startFrom; }).length;
          var total = Math.max(possible, mine.length);
          return { id: k.id, name: k.name, gender: k.gender, grade: k.grade, got: mine.length, total: total, pct: total ? Math.round(100 * mine.length / total) : 0 };
        });
        return { held: held, rows: rows };
      }
      /* ===== pure-end ===== */

      function short(d) { try { return new Date(d + "T00:00:00Z").toLocaleDateString("ar-EG-u-nu-latn", { day: "numeric", month: "long", timeZone: "UTC" }); } catch (e) { return d; } }

      var pcUnsub = null;
      var modal = h("div", { class: "modal", hidden: "" }, h("div", { class: "sheet", id: "pcSheet" }));
      document.body.appendChild(modal);
      function closePct() {
        modal.hidden = true;
        if (pcUnsub) { pcUnsub(); pcUnsub = null; }
      }
      modal.addEventListener("click", function (e) { if (e.target === modal) closePct(); });

      var data = null;
      function build() {
        var s = $("pcSheet"); s.textContent = "";
        s.appendChild(h("div", { class: "top" }, h("h2", { text: "📊 نسب الحضور" }), h("button", { class: "btn", type: "button", text: "إغلاق", onclick: closePct })));
        s.appendChild(h("div", { class: "muted", id: "pcInfo", text: "بيحمّل..." }));
        var bar = h("div", { class: "bar", style: "margin-top:8px" });
        bar.appendChild(h("input", { type: "search", id: "pcQ", placeholder: "ابحث بالاسم", "aria-label": "بحث" }));
        var g = h("select", { id: "pcG", "aria-label": "ولاد ولا بنات" }, h("option", { value: "all", text: "ولاد وبنات" }), h("option", { value: "boys", text: "ولاد" }), h("option", { value: "girls", text: "بنات" }));
        var so = h("select", { id: "pcS", "aria-label": "الترتيب" }, h("option", { value: "low", text: "الأقل حضوراً أولاً" }), h("option", { value: "high", text: "الأعلى حضوراً أولاً" }), h("option", { value: "name", text: "بالاسم" }));
        bar.appendChild(g); bar.appendChild(so);
        s.appendChild(bar);
        s.appendChild(h("div", { class: "list", id: "pcList" }));
        ["pcQ", "pcG", "pcS"].forEach(function (id) { $(id).addEventListener(id === "pcQ" ? "input" : "change", draw); });
      }
      function draw() {
        if (!data) return;
        var box = $("pcList"), nq = A.norm($("pcQ").value), g = $("pcG").value, so = $("pcS").value;
        box.textContent = "";
        var rows = data.rows.filter(function (r) { return (g === "all" || r.gender === g) && (!nq || A.norm(r.name).indexOf(nq) > -1); });
        rows.sort(function (a, b) {
          if (so === "name") return a.name.localeCompare(b.name, "ar");
          var d = so === "low" ? a.pct - b.pct : b.pct - a.pct;
          return d || a.name.localeCompare(b.name, "ar");
        });
        var withData = rows.filter(function (r) { return r.total > 0; });
        var avg = withData.length ? Math.round(withData.reduce(function (s, r) { return s + r.pct; }, 0) / withData.length) : 0;
        $("pcInfo").textContent = data.held.length
          ? "الجمعات اللي اتحسبت (" + data.held.length + "): " + data.held.map(short).join("، ") + " — متوسط الحضور: " + avg + "%"
          : "لسه مفيش جمعة اتسجل فيها حضور.";
        if (!rows.length) { box.appendChild(h("div", { class: "empty", text: "مفيش نتايج." })); return; }
        rows.forEach(function (r) {
          var col = r.pct >= 75 ? "var(--ok)" : r.pct >= 50 ? "var(--gold)" : "var(--danger)";
          var meter = h("div", { style: "height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px" },
            h("div", { style: "height:100%;width:" + r.pct + "%;background:" + col }));
          box.appendChild(h("div", { class: "row" },
            h("div", { class: "who" },
              h("strong", { text: (r.gender === "girls" ? "👧 " : "👦 ") + r.name }),
              h("span", { class: "muted", text: "سنة " + A.gradeLabel(r.grade) + " • حضر " + r.got + " من " + r.total }),
              meter),
            h("strong", { style: "color:" + col + ";font-size:1.3rem", text: r.pct + "%" })));
        });
      }

      /* بيسمع للتغييرات مباشرة، فالنسب بتتحدّث أول بأول وهي مفتوحة */
      function openPct() {
        build(); modal.hidden = false;
        if (pcUnsub) { pcUnsub(); pcUnsub = null; }
        pcUnsub = A.db().collection("attendance").onSnapshot(function (snap) {
          var added = {};
          A.allKids().forEach(function (k) { if (k.added) added[k.id] = k.added; });
          var docs = snap.docs.map(function (d) {
            var v = d.data() || {};
            return { id: d.id, name: String(v.name || ""), gender: v.gender === "girls" ? "girls" : "boys", grade: v.grade === 6 ? 6 : 5, att: Array.isArray(v.att) ? v.att.filter(function (x) { return typeof x === "string"; }) : [] };
          });
          data = computePercents(docs, A.todayStr(), added, FIRST);
          draw();
        }, function () { $("pcInfo").textContent = "مقدرتش أقرأ الحضور. اتأكد من الـ Rules بتاعة attendance."; });
      }

      var btn = h("button", { class: "btn", type: "button", id: "attPct", text: "📊 نسب الحضور" });
      btn.addEventListener("click", openPct);
      var bar0 = document.querySelector("#attPanel .bar");
      if (bar0) bar0.appendChild(btn);
    })();
  </script>
